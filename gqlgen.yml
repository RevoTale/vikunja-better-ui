schema:
  - internal/graphql/schema/*.graphqls

exec:
  filename: internal/graphql/generated/generated.go
  package: generated

model:
  filename: internal/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graphql/resolver
  package: resolver
  filename_template: "{name}.resolvers.go"
  preserve_resolver: true

models:
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  LocalDate:
    model:
      - github.com/RevoTale/vikunja-better-ui/internal/graphql/model.LocalDate
  LocalTime:
    model:
      - github.com/RevoTale/vikunja-better-ui/internal/graphql/model.LocalTime
  LocalDateTime:
    model:
      - github.com/RevoTale/vikunja-better-ui/internal/graphql/model.LocalDateTime
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
