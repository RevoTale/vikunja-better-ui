name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  required-checks:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium webkit
      - name: Verify generated code
        run: task gen:check
      - name: Validate
        run: task validate
      - name: Test
        run: task test
      - name: Test UI against Vikunja 2.5.0
        run: task e2e
      - name: Smoke-test production image
        run: task image:smoke
      - name: Upload browser diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
