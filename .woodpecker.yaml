# Steps share one workspace and run sequentially. A release image is built only
# after the complete tag verification succeeds.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/v*

# Fixed path because CI_WORKSPACE is available at runtime, not YAML interpolation.
workspace:
  base: /woodpecker
  path: src

services:
  - name: postgres
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: vikunja_test
      POSTGRES_DB: vikunja_test
      POSTGRES_HOST_AUTH_METHOD: trust

steps:
  - name: go-tools
    image: golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d
    commands:
      - mkdir -p .cache/ci/bin
      - cp -a /usr/local/go .cache/ci/
      - export GOMODCACHE="$${PWD}/.cache/ci/mod" GOCACHE="$${PWD}/.cache/ci/build" GOTOOLCHAIN=local
      - go -C tools build -o ../.cache/ci/bin/task github.com/go-task/task/v3/cmd/task
    when:
      - event: pull_request
      - event: push
        branch: main
      - event: tag
        ref: refs/tags/v*

  - name: golangci-lint
    image: golangci/golangci-lint@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
    commands:
      - install -D /usr/bin/golangci-lint .cache/ci/bin/golangci-lint
    when:
      - event: pull_request
      - event: push
        branch: main
      - event: tag
        ref: refs/tags/v*

  - name: pnpm
    image: ghcr.io/pnpm/pnpm:12.11.2@sha256:fd95b696aff515e5c58f59248435c29d783fce85cfc9a28c9db3b994bffa44dd
    commands:
      - cp -a /opt/pnpm .cache/ci/pnpm
    when:
      - event: pull_request
      - event: push
        branch: main
      - event: tag
        ref: refs/tags/v*

  - name: required-checks
    image: &node node:26.12.0-trixie-slim@sha256:e556a144463cc8dc53afe8de6d2fa0db5c132fd39ffa232c17641bd40df2bf11
    commands:
      - export PATH="$${PWD}/.cache/ci/go/bin:$${PWD}/.cache/ci/bin:$${PWD}/.cache/ci/pnpm:$${PATH}"
      - export GOMODCACHE="$${PWD}/.cache/ci/mod" GOCACHE="$${PWD}/.cache/ci/build" GOTOOLCHAIN=local
      - apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev git curl ca-certificates procps
      - pnpm --dir frontend install --frozen-lockfile
      - task gen:check
      - task validate
      - task test:ci
      - go run ./tests/e2e/harness wait-postgres
    when:
      - event: pull_request
      - event: push
        branch: main
      - event: tag
        ref: refs/tags/v*

  # Native detached service: start after PostgreSQL readiness, without a shell in the scratch image.
  - name: vikunja
    image: vikunja/vikunja:2.7.0@sha256:e2204a1c1c6a81e833c2b3a5442be182ca2335b54c2e7e37578cc3fe12a27cfc
    detach: true
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres:5432
      VIKUNJA_DATABASE_USER: vikunja_test
      VIKUNJA_DATABASE_PASSWORD: ""
      VIKUNJA_DATABASE_DATABASE: vikunja_test
      VIKUNJA_DATABASE_SSLMODE: disable
      VIKUNJA_FILES_BASEPATH: /tmp/vikunja-files
      VIKUNJA_SERVICE_INTERFACE: ":3456"
      VIKUNJA_SERVICE_PUBLICURL: http://vikunja:3456
      VIKUNJA_SERVICE_FRONTENDURL: http://vikunja:3456
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_MAILER_ENABLED: "false"

  - name: e2e-pr
    image: *node
    environment:
      E2E_VIKUNJA_SERVICE: "1"
    commands:
      - export PATH="$${PWD}/.cache/ci/go/bin:$${PWD}/.cache/ci/bin:$${PWD}/.cache/ci/pnpm:$${PATH}"
      - export GOMODCACHE="$${PWD}/.cache/ci/mod" GOCACHE="$${PWD}/.cache/ci/build" GOTOOLCHAIN=local
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
      - pnpm --dir frontend exec playwright install --with-deps chromium webkit
      - task e2e:pr
    when:
      - event: pull_request

  - name: e2e-full
    image: *node
    environment:
      E2E_VIKUNJA_SERVICE: "1"
    commands:
      - export PATH="$${PWD}/.cache/ci/go/bin:$${PWD}/.cache/ci/bin:$${PWD}/.cache/ci/pnpm:$${PATH}"
      - export GOMODCACHE="$${PWD}/.cache/ci/mod" GOCACHE="$${PWD}/.cache/ci/build" GOTOOLCHAIN=local
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
      - pnpm --dir frontend exec playwright install --with-deps chromium webkit
      - task e2e
    when:
      - event: push
        branch: main
      - event: tag
        ref: refs/tags/v*

  - name: production-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings:
      repo: ghcr.io/revotale/vikunja-better-ui
      platforms: linux/amd64,linux/arm64
      dry_run: true
      buildkit_oci_max_parallelism: 2
    when:
      - event: push
        branch: main

  - name: release
    # 4.x images copy amd64 esbuild into the arm64 image and cannot start on our Pi runner.
    image: woodpeckerci/plugin-ready-release-go:2.1.1@sha256:58ab6f79fa3fa1dfb33263d2b603efa7b49a4353ebac811733e695f176b7f33d
    settings:
      forge_token:
        from_secret: github_token
      git_email: release@users.noreply.github.com
      release_branch: main
    when:
      - event: push
        branch: main

  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings:
      registry: ghcr.io
      repo: ghcr.io/revotale/vikunja-better-ui
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      platforms: linux/amd64,linux/arm64
      username: l-you
      password:
        from_secret: github_token
      buildkit_oci_max_parallelism: 2
      labels:
        - org.opencontainers.image.source=https://github.com/${CI_REPO}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.version=${CI_COMMIT_TAG}
    when:
      - event: tag
        ref: refs/tags/v*

  - name: github-release
    image: woodpeckerci/plugin-release:0.3.2@sha256:a045e18674319a2e3e534b5b674c100a0f01a9fc718dd03ab6732155b228e61b
    settings:
      api_key:
        from_secret: github_token
      title: ${CI_COMMIT_TAG}
      generate-release-notes: true
    when:
      - event: tag
        ref: refs/tags/v*
