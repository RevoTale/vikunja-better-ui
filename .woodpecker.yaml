# Steps share one workspace and run sequentially; release never races checks.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag

steps:
  - name: go-tools
    image: golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d
    commands:
      - mkdir -p .cache/ci
      - cp -a /usr/local/go .cache/ci/
      - export GOBIN="$${PWD}/.cache/ci/bin" GOMODCACHE="$${PWD}/.cache/ci/mod" GOCACHE="$${PWD}/.cache/ci/build"
      - go -C tools install tool
    when:
      - event: pull_request
      - event: push
        branch: main

  - name: pnpm
    image: ghcr.io/pnpm/pnpm:12.11.2@sha256:fd95b696aff515e5c58f59248435c29d783fce85cfc9a28c9db3b994bffa44dd
    commands:
      - cp -a /pnpm .cache/ci/
    when:
      - event: pull_request
      - event: push
        branch: main

  - name: required-checks
    image: &node node:26.11.1-trixie-slim@sha256:193fe51b64e77981119c98c2002c9e32a70e2f006fb4d25068ce0558998917f0
    commands:
      - export PATH="$${PWD}/.cache/ci/go/bin:$${PWD}/.cache/ci/bin:$${PWD}/.cache/ci/pnpm/bin:$${PATH}"
      - export GOMODCACHE="$${PWD}/.cache/ci/mod" GOCACHE="$${PWD}/.cache/ci/build"
      - apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev git curl ca-certificates openssl gnupg unzip procps
      - pnpm --dir frontend install --frozen-lockfile
      - pnpm --dir frontend exec playwright install --with-deps chromium webkit
      - task gen:check
      - task validate
      - task test
      - task e2e
    when:
      - event: pull_request
      - event: push
        branch: main

  - name: production-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings:
      repo: ghcr.io/revotale/vikunja-better-ui
      platforms: linux/amd64,linux/arm64
      dry_run: true
      buildkit_oci_max_parallelism: 2
    when:
      - event: pull_request
      - event: push
        branch: main

  - name: release
    image: woodpeckerci/plugin-ready-release-go:4.1.1
    settings:
      forge_token:
        from_secret: github_token
      git_email: release@users.noreply.github.com
      release_branch: main
    when:
      - event: push
        branch: main

  - name: publish-image
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings:
      registry: ghcr.io
      repo: ghcr.io/revotale/vikunja-better-ui
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      platforms: linux/amd64,linux/arm64
      username: l-you
      password:
        from_secret: github_token
      buildkit_oci_max_parallelism: 2
      labels:
        - org.opencontainers.image.source=https://github.com/${CI_REPO}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.version=${CI_COMMIT_TAG}
    when:
      - event: tag
