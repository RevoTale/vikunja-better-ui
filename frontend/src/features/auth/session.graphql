query AuthSession {
  session {
    use12HourTime
    authenticated
    csrfToken
    expiresAt
  }
}

query Session {
  session {
    use12HourTime
    authenticated
    csrfToken
    expiresAt
    vikunjaUser {
      id
      username
      timezone
      weekStart
      defaultProjectId
    }
  }
}
