query TaskDetails($id: ID!) {
  task(id: $id) {
    id
    title
    description
    kind
    isDone
    doneAt
    completionOutcome
    priority
    dueAt
    hasDueTime
    startAt
    endAt
    isOverdue
    timezone
    project {
      id
      title
      isDefault
    }
    recurrenceRule {
      interval
      unit
      mode
    }
    labels {
      id
      title
    }
  }
}

mutation SkipRecurringTask($input: SkipRecurringTaskInput!) {
  skipRecurringTask(input: $input) {
    status
    completedTask {
      id
      completionOutcome
    }
    nextOccurrence {
      id
      dueAt
    }
    repairCapability
    missingMarkers
    remainingRepairSteps
  }
}

mutation DeleteTask($input: DeleteTaskInput!) {
  deleteTask(input: $input) {
    deletedTaskId
  }
}

query TaskDiagnostics($id: ID!) {
  taskDiagnostics(id: $id) {
    id
    projectId
    title
    kind
    isDone
    doneAt
    dueAt
    startAt
    endAt
    priority
    recurrenceRule {
      interval
      unit
      mode
    }
    labels {
      id
      title
    }
    createdAt
    updatedAt
    creator {
      id
      username
      name
    }
    maxPermission
  }
}
