version: "3"

tasks:
  gen:
    desc: Generate backend and frontend code
    cmds:
      - go tool gqlgen generate
      - pnpm --dir frontend run generate:graphql
      - pnpm --dir frontend run build

  gen:check:
    desc: Verify generated backend and frontend files are current
    cmds:
      - |
        before="$(mktemp)"
        after="$(mktemp)"
        trap 'rm -f "$before" "$after"' EXIT
        find internal/graphql/generated internal/graphql/model internal/graphql/resolver frontend/src/graphql frontend/src/routeTree.gen.ts -type f -print0 | sort -z | xargs -0 sha256sum > "$before"
        task gen
        find internal/graphql/generated internal/graphql/model internal/graphql/resolver frontend/src/graphql frontend/src/routeTree.gen.ts -type f -print0 | sort -z | xargs -0 sha256sum > "$after"
        cmp "$before" "$after"

  fix:
    desc: Format project files
    cmds:
      - find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -w
      - pnpm --dir frontend exec biome check --write .

  validate:
    desc: Run non-mutating validation
    cmds:
      - test -z "$(find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
      - go vet ./...
      - golangci-lint run ./...
      - pnpm --dir frontend run lint
      - pnpm --dir frontend run typecheck
      - pnpm --dir frontend run build
      - |
        output="$(mktemp)"
        trap 'rm -f "$output"' EXIT
        go build -o "$output" ./cmd/server

  test:
    desc: Run backend and frontend tests
    cmds:
      - pnpm --dir frontend run build
      - go test ./... -race
      - pnpm --dir frontend run test

  e2e:
    desc: Run Playwright against an isolated Vikunja 2.5.0 binary
    cmds:
      - tests/e2e/harness/run.sh

  demo:
    desc: Run the complete isolated demo on port 4180
    vars:
      DEMO_PORT: '{{default "4180" .DEMO_PORT}}'
      DEMO_ORIGIN: '{{default (printf "http://localhost:%s" .DEMO_PORT) .DEMO_ORIGIN}}'
    env:
      E2E_DEMO: "1"
      E2E_APP_PORT: "{{.DEMO_PORT}}"
      E2E_DEMO_ORIGIN: "{{.DEMO_ORIGIN}}"
    cmds:
      - tests/e2e/harness/run.sh

  image:smoke:
    desc: Build and smoke-test the non-root production image
    cmds:
      - tests/image/smoke.sh

  dev:
    desc: Run the development application
    cmds:
      - pnpm --dir frontend run build
      - go run ./cmd/server
