version: "3"

tasks:
  gen:
    desc: Generate backend and frontend code
    cmds:
      - go tool gqlgen generate
      - pnpm --dir frontend run generate:graphql
      - pnpm --dir frontend run build

  gen:check:
    desc: Verify generated backend and frontend files are current
    cmds:
      - go run ./tests/quality generated-check

  fix:
    desc: Format project files
    cmds:
      - golangci-lint fmt ./...
      - pnpm --dir frontend exec biome check --write .

  validate:
    desc: Run non-mutating validation
    cmds:
      - task: quality:test
      - task: go:format:check
      - task: go:fix:check
      - go run ./tests/quality size
      - go vet ./...
      - golangci-lint run ./...
      - pnpm --dir frontend run lint
      - pnpm --dir frontend run typecheck
      - pnpm --dir frontend run build
      - go run ./tests/quality build

  test:
    desc: Run backend and frontend tests with race detection
    cmds:
      - pnpm --dir frontend run build
      - go test -race -count=2 -shuffle=on ./...
      - pnpm --dir frontend run test

  test:ci:
    desc: Run backend and frontend tests on the race-incompatible CI runner
    cmds:
      - pnpm --dir frontend run build
      - go test -count=2 -shuffle=on ./...
      - pnpm --dir frontend run test

  quality:test:
    desc: Verify quality gates reject invalid inputs
    env:
      QUALITY_TOOL_TESTS: "1"
    cmds:
      - go test -count=1 ./tests/quality
      - go test -count=1 ./tests/e2e/harness/...
      - node --test tests/e2e/harness/*.test.mjs

  go:format:check:
    desc: Check Go formatting without modifying files
    cmds:
      - go run ./tests/quality empty-output golangci-lint fmt --diff

  go:fix:check:
    desc: Reject pending Go modernization changes
    cmds:
      - go run ./tests/quality empty-output go fix -diff ./...

  e2e:
    desc: Run the full Playwright matrix against an isolated Vikunja 2.7.0 instance
    cmds:
      - go run ./tests/e2e/harness run --project=phone-320 --project=phone-webkit --project=desktop-1440 --project=timezone-webkit

  e2e:pr:
    desc: Run the fast PR Playwright matrix against an isolated Vikunja 2.7.0 instance
    cmds:
      - go run ./tests/e2e/harness run --project=pr-chromium --project=pr-webkit

  demo:
    desc: Run the complete isolated demo on port 4180
    vars:
      DEMO_PORT: '{{default "4180" .DEMO_PORT}}'
      DEMO_ORIGIN: '{{default (printf "http://localhost:%s" .DEMO_PORT) .DEMO_ORIGIN}}'
    env:
      E2E_DEMO: "1"
      E2E_APP_PORT: "{{.DEMO_PORT}}"
      E2E_DEMO_ORIGIN: "{{.DEMO_ORIGIN}}"
    cmds:
      - go run ./tests/e2e/harness run

  image:smoke:
    desc: Build and smoke-test the non-root production image
    cmds:
      - go run ./tests/image

  dev:
    desc: Run the development application
    cmds:
      - pnpm --dir frontend run build
      - go run ./cmd/server
