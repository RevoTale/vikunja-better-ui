version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gocritic
    - gosec
    - misspell
    - modernize
    - noctx
    - perfsprint
    - prealloc
    - revive
    - sloglint
    - unconvert
    - wastedassign
    - whitespace
  exclusions:
    generated: strict
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - funlen
  settings:
    funlen:
      lines: 60
      statements: 40
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
